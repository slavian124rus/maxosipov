name: maxosipov

# Продакшн-стек для выкладки через GitHub Actions (.github/workflows/ci-cd.yml).
# Образ собирается в CI и лежит в GHCR — на сервере ничего не собирается.
# Запуск (делает scripts/remote-deploy.sh):
#   docker compose --env-file .env --env-file .deploy.env -f docker/compose.prod.yml up -d
# .env — секреты (создаётся один раз на сервере), .deploy.env — только IMAGE=<тег>.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxosipov
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d maxosipov']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${IMAGE:?IMAGE не задан}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/maxosipov
      MEDIA_ROOT: /data/media
    depends_on:
      db:
        condition: service_healthy
    command: ['sh', '-c', 'node dist/migrate.js && node server.js']
    # Загрузки и импорт каталога пишут в MEDIA_ROOT; Caddy и worker читают тот же каталог на хосте.
    # Без тома файлы оседают внутри контейнера и пропадают при деплое.
    volumes:
      - /data/media:/data/media
    ports:
      # наружу сайт отдаёт caddy; порт на localhost нужен для проверки health при деплое
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:3000/api/health | grep -q "\"ok\":true"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ${IMAGE:?IMAGE не задан}
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@db:5432/maxosipov
      MEDIA_ROOT: /data/media
    depends_on:
      db:
        condition: service_healthy
    command: ['node', 'dist/worker.js']
    volumes:
      - /data/media:/data/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - /data/media:/srv/media:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
