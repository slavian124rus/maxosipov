services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maxosipov
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # 5433 снаружи: на машинах разработчиков 5432 часто занят локальным PostgreSQL
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
